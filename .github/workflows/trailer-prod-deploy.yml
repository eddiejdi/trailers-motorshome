name: Trailer Prod Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "main.js"
      - "PaletteService.js"
      - "WeightService.js"
      - "src/**"
      - "trailer_lib/**"
      - "docs/**"
      - "hooks/**"
      - "scripts/validate_exports.py"
      - ".github/workflows/trailer-prod-deploy.yml"
  workflow_dispatch:
    inputs:
      reason:
        description: "Deploy reason"
        required: false
        default: "manual"

concurrency:
  group: trailer-prod-deploy
  cancel-in-progress: true

jobs:
  validate-exports:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate export regression gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_exports.py

  deploy:
    needs: validate-exports
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Pull latest on server
        shell: bash
        run: |
          set -euo pipefail
          cd /var/www/rpa4all.com/trailer
          git fetch origin
          git reset --hard origin/main
          git clean -fd
          sudo chown -R homelab:www-data .
          sudo chmod -R g+rX .

      - name: Validate deployed module signature
        shell: bash
        run: |
          set -euo pipefail
          grep -q "interiorGroup()" /var/www/rpa4all.com/trailer/src/services/PaletteService.js
          grep -qv "this.interior.add(mesh)" /var/www/rpa4all.com/trailer/src/services/PaletteService.js
          echo "Palette fix verified."
